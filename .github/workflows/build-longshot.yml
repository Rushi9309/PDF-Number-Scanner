name: Build LongShot Auto Scroll Companion APK
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract Android source ZIP
        run: |
          mkdir -p project
          unzip -q LongShot_AutoScroll_Companion_Source.zip -d project
      - name: Compile app
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LongShot-AutoScroll-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
